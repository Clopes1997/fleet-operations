services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fleet
      MYSQL_USER: fleet
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes: [fleet-db:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build: ./apps/api
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DB_NAME: fleet
      DB_USER: fleet
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_HOST: db
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set HTTPS public origin}
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./apps/web
    ports: ["127.0.0.1:8089:80"]
    depends_on: [api]
volumes:
  fleet-db:
